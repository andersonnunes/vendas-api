# Credenciais de dev do ambiente efêmero do CD (kind). Não são segredos de produção.
apiVersion: v1
kind: Secret
metadata:
  name: vendas-api-secret
  namespace: vendas
type: Opaque
stringData:
  ConnectionStrings__VendasDb: Host=vendas-db;Port=5432;Database=vendas;Username=vendas;Password=vendas
  Pagamentos__SegredoWebhook: dev-webhook-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: vendas-db-secret
  namespace: vendas
type: Opaque
stringData:
  POSTGRES_DB: vendas
  POSTGRES_USER: vendas
  POSTGRES_PASSWORD: vendas
