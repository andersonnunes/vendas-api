# API do vendas-api. A imagem é trocada pelo kustomize (kustomization.yaml): localmente aponta
# para o registry local (localhost:5000); no CD, para o digest publicado no GHCR.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendas-api
  namespace: vendas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vendas-api
  template:
    metadata:
      labels:
        app: vendas-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      # O Service headless do banco só resolve depois que o pod do banco fica pronto. Sem esperar,
      # a API tenta conectar antes do DNS existir, cai e reinicia.
      initContainers:
        - name: esperar-banco
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z vendas-db 5432; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: localhost:5000/vendas-api:dev
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: vendas-api-config
            - secretRef:
                name: vendas-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: chaves-dataprotection
              mountPath: /home/app/.aspnet
      volumes:
        - name: tmp
          emptyDir: {}
        - name: chaves-dataprotection
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vendas-api
  namespace: vendas
spec:
  selector:
    app: vendas-api
  ports:
    - name: http
      port: 8080
      targetPort: http
