# Ambiente de desenvolvimento local deste repositório, isolado do veiculos-api.
# Rodar a partir da raiz do repositório: docker compose -f infra/docker-compose.yml up --build
#
# Banco próprio (vendas-db). Não sobe Keycloak: os tokens vêm do Keycloak do veiculos-api
# (porta 8180), que precisa estar de pé.
name: vendas-api

services:
  vendas-api:
    build:
      context: ..
      dockerfile: src/VendasApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Credenciais de dev do próprio vendas-db abaixo — ambiente local efêmero, não é
      # segredo de produção.
      - ConnectionStrings__VendasDb=Host=vendas-db;Port=5432;Database=vendas;Username=vendas;Password=vendas
      # Usa o Keycloak do veiculos-api (publicado na máquina na porta 8180), para que os tokens
      # emitidos por ele sejam aceitos aqui. O emissor (localhost:8180) é o que o token carrega
      # no claim `iss`; o host.docker.internal é o endereço alcançável de dentro do contêiner.
      - Keycloak__EmissorPublico=http://localhost:8180/realms/revendax
      - Keycloak__MetadataInterna=http://host.docker.internal:8180/realms/revendax/.well-known/openid-configuration
      - Keycloak__EndpointToken=http://host.docker.internal:8180/realms/revendax/protocol/openid-connect/token
      # O veiculos-api roda em outro compose e publica a porta 5001 na máquina.
      - VeiculosApi__BaseUrl=http://host.docker.internal:5001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5002:8080"
    depends_on:
      vendas-db:
        condition: service_healthy

  vendas-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=vendas
      - POSTGRES_USER=vendas
      - POSTGRES_PASSWORD=vendas
    ports:
      - "5434:5432"
    volumes:
      - vendas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendas -d vendas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vendas-db-data:
